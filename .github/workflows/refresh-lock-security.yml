name: refresh security lock
on:
  push:
    branches:
      - security/dependabot-remediation
    paths:
      - pyproject.toml
      - uv.lock
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - name: Regenerate lockfile
        run: uv lock --upgrade
      - name: Commit lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock
          git diff --cached --quiet || git commit -m "chore(security): regenerate uv lockfile"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/refresh-lock-security.yml
          git commit -m "chore: remove temporary security lock workflow"
          git push
