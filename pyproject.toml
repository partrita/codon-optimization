[project]
name = "codon-optimization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "deepthought", email = "deepthough@postech.ac.kr" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.2.1",
    "numpy>=2.1.3",
    "pandas>=2.2.3",
    "tensorflow>=2.19.0",
    "keras>=3.15.1",
    "protobuf>=5.29.6,<6.0.0dev",
    "wheel>=0.46.2",
    "werkzeug>=3.1.6",
    "requests>=2.32.4",
    "markdown>=3.8.1",
]

[project.scripts]
codon-optimization = "codon_optimization.rnn_predict:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
